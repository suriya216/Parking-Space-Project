<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-label="Covered parking garage with a sedan under a concrete roof">
  <defs>
    <linearGradient id="cgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B4965"/><stop offset="1" stop-color="#5FA8D3"/>
    </linearGradient>
    <linearGradient id="cgFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#495057"/><stop offset="1" stop-color="#212529"/>
    </linearGradient>
  </defs>

  <rect width="400" height="260" fill="url(#cgSky)"/>
  <!-- back wall -->
  <rect x="0" y="40" width="400" height="130" fill="#343A40"/>
  <rect x="0" y="40" width="400" height="8" fill="#212529" opacity=".5"/>
  <!-- roof slab -->
  <rect x="0" y="18" width="400" height="26" fill="#DEE2E6"/>
  <rect x="0" y="38" width="400" height="6" fill="#ADB5BD"/>
  <!-- support pillars -->
  <rect x="34" y="44" width="20" height="126" fill="#E9ECEF"/>
  <rect x="346" y="44" width="20" height="126" fill="#E9ECEF"/>
  <rect x="34" y="44" width="6" height="126" fill="#FFFFFF" opacity=".55"/>
  <rect x="346" y="44" width="6" height="126" fill="#FFFFFF" opacity=".55"/>
  <!-- ceiling light -->
  <rect x="176" y="44" width="48" height="7" rx="3" fill="#FCC419"/>
  <ellipse cx="200" cy="92" rx="86" ry="44" fill="#FCC419" opacity=".13"/>
  <!-- floor -->
  <rect x="0" y="170" width="400" height="90" fill="url(#cgFloor)"/>
  <!-- painted bay markings -->
  <path d="M96 260 L128 176 h9 L109 260 Z" fill="#F7F6F3" opacity=".8"/>
  <path d="M300 260 L272 176 h9 L313 260 Z" fill="#F7F6F3" opacity=".8"/>
  <rect x="150" y="176" width="100" height="7" rx="3" fill="#62D2A2" opacity=".85"/>

  <!-- sedan -->
  <g>
    <ellipse cx="200" cy="232" rx="96" ry="12" fill="#000" opacity=".33"/>
    <path d="M126 214 q4-40 22-44 h104 q18 4 22 44 z" fill="#5FA8D3"/>
    <path d="M150 176 q6-22 20-24 h60 q14 2 20 24 z" fill="#0D1B2A" opacity=".82"/>
    <path d="M156 174 q5-18 17-19 h54 q12 1 17 19 z" fill="#9BD9F5" opacity=".9"/>
    <rect x="122" y="206" width="156" height="16" rx="8" fill="#1B4965"/>
    <circle cx="152" cy="222" r="17" fill="#212529"/><circle cx="152" cy="222" r="7" fill="#ADB5BD"/>
    <circle cx="248" cy="222" r="17" fill="#212529"/><circle cx="248" cy="222" r="7" fill="#ADB5BD"/>
    <rect x="120" y="200" width="14" height="8" rx="4" fill="#FCC419"/>
    <rect x="266" y="200" width="14" height="8" rx="4" fill="#E03131"/>
  </g>

  <!-- covered tag -->
  <g>
    <rect x="14" y="14" width="92" height="26" rx="13" fill="#0D1B2A" opacity=".82"/>
    <text x="60" y="31" font-family="'DM Sans',system-ui,sans-serif" font-size="12" font-weight="700" fill="#62D2A2" text-anchor="middle">COVERED</text>
  </g>
</svg>
