name: Playwright Tests
# The full suite is expensive (388 tests, three browser engines), so it runs
# at exactly one point: when code lands on main. Not on pull requests, not
# on feature branches — lint.yml covers those. A PR merged into main still
# triggers this, because a merge IS a push to main.
on:
  push:
    branches: [ main ]
  # Lets you trigger the suite by hand from the Actions tab against any
  # branch, so you can get a full run before merging when you want one.
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    # The HTML reporter copies every attachment — videos, screenshots and
    # trace zips — into playwright-report/data/, so this one directory is
    # the complete evidence bundle. `!cancelled()` is what makes it upload
    # on a failing run, which is when you actually need it.
    - name: Upload Playwright report (video, screenshots, traces)
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
        # webm video and trace zips are already compressed; re-zipping them
        # costs minutes of CI time and saves almost nothing.
        compression-level: 0